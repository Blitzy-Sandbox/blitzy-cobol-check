plugins {
    id 'groovy'
}

repositories {
    mavenCentral()
}

dependencies {
    // BuildHelper's comparison contract is enforced by BuildHelperTest. JUnit 5 matches the
    // framework the root build already uses, so no new test technology is introduced.
    //
    // 5.7.0 is the RESOLVED coordinate, reached by stepping down within the 5.x line from the
    // primary 5.14.4. Measured reason: Gradle 6.9.4 bundles junit-platform-launcher 1.7.0 and
    // uses it whenever the launcher is not declared explicitly, so Jupiter 5.14.4 (which pulls
    // junit-platform-engine 1.14.4) aborts the test executor before discovery with
    //   "OutputDirectoryCreator not available; probably due to unaligned versions of the
    //    junit-platform-engine and junit-platform-launcher jars on the classpath".
    // Jupiter 5.7.0 implies platform 1.7.0 - an exact match for the bundled launcher - and is
    // already resolved by the root build at [build.gradle:L103], so it adds zero new artefacts.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.0'
}

test {
    useJUnitPlatform()
}
