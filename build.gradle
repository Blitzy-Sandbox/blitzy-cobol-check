import static org.apache.tools.ant.taskdefs.condition.Os.*

plugins {
    id 'java-library'
    id 'org.sonarqube' version '3.0'
    id 'jacoco'
}

def productVersion = '0.2.19'
def productName = 'cobol-check'
group = 'org.openmainframeproject'
description = 'Unit testing framework for Cobol'

def approvalExpectedOutput = "./expected-output.txt"
def approvalActualOutput = "./actual-output.txt"

sonarqube {
    properties {
        property "sonar.projectKey", "neopragma_cobol-check"
        property "sonar.organization", "neopragma-github"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.exclusions", "**/EIBResponseCodes.java,**/Keyword.java"
    }
}

jacoco {
    toolVersion = "0.8.6"
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'CLASS'
            limit {
                minimum = 0.8
            }
            excludes = ['*Constants',
                        '*Exception',
                        '*DirectoryNameMatcher',
                        '*Driver',
                        '*EIBResponseCodes',
                        '*Exception*',
                        '*Generator',
                        '*Keyword',
                        '*LinuxProcessLauncher',
                        '*Log',
                        '*Flag',
                        '*StringHelper',
                        '*TestSuiteConcatenator']
        }
        rule {
            element = 'CLASS'
            limit {
                minimum = 0.2
            }
            includes = ['*LinuxProcessLauncher',
                        '*TestSuiteConcatenator']
        }
    }
}

ext {
    mainClassName = 'org.openmainframeproject.cobolcheck.Main'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        resources {
            srcDirs "src/main/resources", "src/test/resources"
        }
    }
}

test {
    description 'Runs all tests'
    testLogging {
        showStandardStreams = true
        events "passed", "skipped", "failed"
    }
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.compilerArgs << '-Xlint:deprecation'
    options.deprecation = true
}

dependencies {
    implementation 'org.jetbrains:annotations:15.0'
    implementation 'javax.xml.bind:jaxb-api:2.3.0'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:2.3.2'
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.2'
    testImplementation('org.junit.jupiter:junit-jupiter:5.6.1')
    testImplementation('org.junit.jupiter:junit-jupiter-params:5.7.0')
    testImplementation 'org.mockito:mockito-inline:3.6.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:3.6.28'
}

def unitTest = tasks.register("unitTest", Test) {
    description 'Run unit tests only'
    useJUnitPlatform()
    filter {
        includeTestsMatching "org.openmainframeproject.cobolcheck.*Test"
    }
}
def integrationTest = tasks.register("integrationTest", Test) {
    description 'Run integration tests only'
    dependsOn unitTest
    useJUnitPlatform()
    filter {
        includeTestsMatching "org.openmainframeproject.cobolcheck.*IT"
    }
}

task clearLibJar(type: Delete) {
    delete fileTree(dir:'build/libs', include: '**.jar')
}

task fatJar(type: Jar) {
//    archiveFileName "${productName}-${productVersion}.jar"
    archiveName "${productName}-${productVersion}.jar"
    description 'Create executable jar'
    dependsOn integrationTest, clearLibJar
    manifest {
        attributes 'Main-Class': "${mainClassName}",
                   'Implementation-Title': 'Gradle Quickstart',
                   'Implementation-Version': productVersion
    }
    from { configurations.compile.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

task copyJarToBin(type: Copy) {
    description 'Copy executable jar to bin directory prior to distribution'
    dependsOn fatJar
    from('build/libs/')
    include '**/*.jar'
    into 'bin/'
}

task clearExtensionJar(type: Delete) {
    delete fileTree(dir:'vs-code-extension/Cobol-check/bin', include: '**.jar')
}

task copyJarToExtension(type: Copy) {
    description 'Copy executable jar to bin and VS Code extension bin directories prior to distribution'
    dependsOn clearExtensionJar, fatJar
    from('build/libs/')
    include '**/*.jar'
    into 'vs-code-extension/Cobol-check/bin/'
}


task copyRunScripts(type: Copy) {
    description 'Makes copies of run scripts'

    // copy and modify run scripts for bin version
    from "${projectDir}/cobolcheck.cmd"
    into "${projectDir}/temp/approvalTest"
    filter { line -> line.replaceAll('@VERSION@', productVersion) }
    from "${projectDir}/cobolcheck"
    into "${projectDir}/temp/approvalTest"
    filter { line -> line.replaceAll('@VERSION@', productVersion) }

    println("Copied with jar version ${productVersion} to approvalTest directory")

}

task prepareDistribution(type: Zip) {
    archiveName "${productName}-${productVersion}.zip"
    description 'Prepare distribution archive'
    dependsOn copyJarToBin, copyJarToExtension, copyRunScripts
    from ("${projectDir}"){
        include([ "config.properties",
                  "scripts/*",
                  "bin/${productName}-${productVersion}.jar",
                  "src/main/cobol/ALPHA.CBL",
                  "src/main/cobol/NUMBERS.CBL",
                  "src/test/cobol/ALPHA/*",
                  "src/test/cobol/NUMBERS/*" ])
        rename("build/libs/(.*)", "\$1")
    }

    from ("${projectDir}/gradleBuildTemp")

    doLast {
        delete "${projectDir}/gradleBuildTemp"
    }
}

def approvalTest
approvalTest = tasks.register("approvalTest", Test) {
    description 'Run approval test only'
    dependsOn copyJarToBin, copyRunScripts

    // The harness invocation below MUST run as a task action, not in this registration
    // closure. Gradle evaluates build scripts and only then builds the task graph, so
    // configuration-phase code runs BEFORE copyJarToBin and copyRunScripts can have
    // staged bin/cobol-check-<version>.jar and temp/approvalTest/cobolcheck. The harness
    // therefore ran against a missing (exit 127) or non-executable (exit 126) launcher,
    // produced a zero-byte actual-output.txt, and the comparison below passed vacuously.
    // Inside doLast the dependsOn above is finally honoured.
    doLast {
        def output = -1
        def weRanATest = false
        def harnessStatus = -1
        def runningOs = OS_NAME.toLowerCase()

        // Every child process is started through this closure, for two reasons.
        //
        // Attribution: Groovy's waitForProcessOutput(System.out, System.err) pumps the child's
        // streams on threads of its own making, and output written from a thread Gradle does not
        // associate with this task's build operation is rendered ungrouped and immediately - which
        // is why the whole harness log used to appear AHEAD of the "> Task :approvalTest" header
        // instead of under it. Buffering the child's output and re-emitting it from this thread
        // keeps every line inside the task's own output group. Child stderr is re-emitted on
        // stderr, so INF009 records stay countable from a stderr capture (they are the only proof
        // a COBOL programme actually ran; the capture file holds stdout only).
        //
        // Status: the exit value is returned rather than discarded, so a harness that could not
        // run at all is distinguishable from one whose output merely differs.
        def runChild = { String command ->
            def proc = command.execute()
            // StringBuffer, not StringBuilder: the pump threads append to these concurrently.
            StringBuffer childOut = new StringBuffer()
            StringBuffer childErr = new StringBuffer()
            proc.waitForProcessOutput(childOut, childErr)
            if (childOut.length() > 0) {
                System.out.print(childOut.toString())
                System.out.flush()
            }
            if (childErr.length() > 0) {
                System.err.print(childErr.toString())
                System.err.flush()
            }
            return proc.exitValue()
        }

        // Called immediately before a harness is launched - and only then, so that an operating
        // system with no harness leaves the working tree exactly as it found it. The harness
        // redirects with `>` [approvaltest:L1], which follows a symbolic link and truncates
        // whatever it points at, a file outside this repository included. The harness scripts are
        // out of scope for this change, so the build refuses to invoke them unless the capture path
        // is absent or an ordinary file. A stale capture is deleted rather than reused, so output
        // from an earlier run can never be judged as if this run had produced it.
        def prepareCapture = {
            def capture = new File(approvalActualOutput)
            if (java.nio.file.Files.isSymbolicLink(capture.toPath())) {
                throw new GradleException("${approvalActualOutput} is a symbolic link - refusing to run the approval harness")
            }
            if (capture.exists() && !capture.isFile()) {
                throw new GradleException("${approvalActualOutput} is not a regular file - refusing to run the approval harness")
            }
            if (capture.exists() && !capture.delete()) {
                throw new GradleException("${approvalActualOutput} could not be deleted - refusing to run the approval harness")
            }
        }

        if (runningOs == "linux") {
            println "Linux detected"
            prepareCapture()

            // The launcher is tracked at mode 0644, so the execute bit has to be granted here.
            // Its status is checked too: without the grant every invocation below would die with
            // exit 126 and write nothing.
            def chmodStatus = runChild("chmod +x ./approvaltest")
            if (chmodStatus != 0) {
                throw new GradleException("chmod +x ./approvaltest exited with status ${chmodStatus}")
            }

            harnessStatus = runChild("./approvaltest")
            weRanATest = true
        }
        if (runningOs.contains("windows")) {
            println "Windows detected"
            prepareCapture()
            harnessStatus = runChild("./approvaltestWin.cmd")
            weRanATest = true
        }

        if (!weRanATest){
            println "No prepared test for the OS detected: ${runningOs} - skipping"
            // Say plainly what this success does NOT mean. The gate has launchers for linux and
            // windows only, so on any other operating system nothing is executed and nothing is
            // compared, yet the task still succeeds. Making it fail closed would change documented
            // behaviour that this change is required to leave intact, so the gap is disclosed here
            // and in RUN-1A-HANDOFF.md 13.13 rather than silently patched.
            logger.warn("WARNING: no approval harness exists for ${runningOs}, so no COBOL programme was executed and ${approvalExpectedOutput} was never compared. The success of this task does NOT mean the approval gate passed.")
        } else {
            // The harness's own exit status is inspected instead of being thrown away. It reflects
            // the LAST cobolcheck invocation only - the six invocations in ./approvaltest are not
            // aggregated there, and that script is out of scope for this change (RUN-1A-HANDOFF.md
            // 13.14) - but inspecting it before the comparison means a harness that could not run
            // is reported as such rather than as a difference in its output.
            println "harness exit status: ${harnessStatus}"
            if (harnessStatus != 0) {
                throw new GradleException("the approval harness exited with status ${harnessStatus}")
            }

            output = new BuildHelper().compareFiles(approvalExpectedOutput, approvalActualOutput, true)
            println "exit from compare: ${output}"

            if (output != 0) {
                println "*** FAIL ***"
                // GradleException, not StopExecutionException: Gradle documents StopExecutionException as
                // skipping the remaining actions and continuing WITHOUT failing the task or the build. It
                // only appeared to work here because a throw from a configuration closure escapes as an
                // ordinary script exception. From a task action it would silently swallow this FAIL verdict.
                throw new GradleException("${approvalExpectedOutput} and ${approvalActualOutput} are different")
            } else {
                println "${approvalExpectedOutput} matches ${approvalActualOutput} - PASS"
            }
        }
    }
}

task defaultProperties {
    description 'Show the default properties for this project'
    println "Project: $project"
    println "Name: $name"
    println "Path: $path"
    println "Project directory: $projectDir"
    println "Build directory: $buildDir"
    println "Version: $version"
    println "Group: $project.group"
    println "Description: $project.description"
}

task osInfo {
    description 'Show information about the operating system'
    doLast {
        println "Family:       ${OS_NAME}"
        println "Version:      ${OS_VERSION}"
        println "Architecture: ${OS_ARCH}"
    }
}

